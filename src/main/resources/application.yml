spring:
    application:
          name: lyhm-ai-code-platform
    #mysql
    datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/lyhm_ai_code_platform
      username: root
      password: 123456
    profiles:
      active: local
    data:
      redis:
        host: localhost
        port: 6379
        password:
        ttl: 3600
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.lyhm.lyhmaicodeplatform.controller

knife4j:
  enable: true
  setting:
    language: zh_cn
